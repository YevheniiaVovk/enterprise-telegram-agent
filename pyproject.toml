[project]
name = "enterprise-telegram-agent"
version = "0.1.0"
description = "Production-ready Telegram Agent with LangChain"
readme = "README.md"
authors = [
    { name = "Yevheniia", email = "missisvovk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.5.1",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
