[project]
name = "enterprise-telegram-agent"
version = "0.1.0"
description = "Production-ready Telegram Agent with LangChain"
readme = "README.md"
authors = [
    { name = "Yevheniia", email = "missisvovk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "langchain>=1.3.15",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.5.1",
    "langgraph>=0.1.0",
    "python-dotenv>=1.0.0",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
    "langchain-community>=0.4.2",
    "ddgs>=9.16.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
